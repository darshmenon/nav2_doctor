[develop]
script_dir=$base/lib/nav2_doctor
[install]
install_scripts=$base/lib/nav2_doctor

[flake8]
max-line-length = 160
exclude = .git,__pycache__,build,install
# doctor.py holds long one-line diagnostic hints (the user-facing text); wrapping them hurts readability
per-file-ignores = nav2_doctor/doctor.py:E501
